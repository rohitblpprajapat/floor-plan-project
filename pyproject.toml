[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vscan"
version = "0.2.0"
description = "Local Insta360 reconstruction and annotation application"
readme = "README.md"
requires-python = "==3.11.16"
dependencies = [
    "pycolmap-cuda12==4.2.0",
    "gtsam==4.2.2",
    "numpy==1.26.4",
    "scipy==1.17.1",
    "opencv-python-headless==4.11.0.86",
    "pillow==12.3.0",
    "pydantic==2.13.5",
    "typer==0.27.2",
    "psutil==7.2.2",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "hatchling==1.32.0",
]

[project.scripts]
vscan = "vscan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["v1", ".*", "data", "runs"]
